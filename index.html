<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    position: fixed; inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #FFF8EE;
  }
  body {
    font-family: 'Jua', system-ui, -apple-system, sans-serif;
    color: #4A3F5C;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  #root { height: 100%; }
  /* touch-action:none on buttons → a tap can never be re-interpreted as a pan (which cancels Pencil taps) */
  button { font-family: inherit; touch-action: none; cursor: pointer; }
  input[type=text] { font-family: inherit; -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .scroll-x button { touch-action: pan-x; }
  .scroll-y button { touch-action: pan-y; }
  .scroll-y { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* Big, finger/Pencil-friendly slider (말 빠르기) */
  .big-range { -webkit-appearance: none; appearance: none; height: 48px; background: transparent; touch-action: none; }
  .big-range::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #BAE6FD, #FDBA74); }
  .big-range::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: -13px; border-radius: 50%;
    background: #FB923C; border: 5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .big-range::-moz-range-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #BAE6FD, #FDBA74); }
  .big-range::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #FB923C; border: 5px solid #fff; }

  /* Drawing surface: no scrolling, zooming, or system gestures */
  .pad, .pad canvas { touch-action: none; -ms-touch-action: none; }
  .pad canvas { position: absolute; left: 0; top: 0; display: block; }

  /* Horizontal picker strip is the only scrollable area */
  .scroll-x {
    overflow-x: auto; overflow-y: hidden;
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  .scroll-x::-webkit-scrollbar { display: none; }

  .title-grad {
    background: linear-gradient(90deg, #FB7185, #FB923C 45%, #A78BFA);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .soft { box-shadow: 0 8px 24px rgba(251, 146, 60, 0.14), 0 2px 0 rgba(0,0,0,0.04); }

  /* Chunky "press-down" buttons */
  .btn3d { box-shadow: 0 6px 0 rgba(0,0,0,0.16); transition: transform .08s ease, box-shadow .08s ease, filter .15s; }
  .btn3d:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.16); }
  .btn3d:disabled { filter: grayscale(.6) opacity(.55); }

  /* Layout (tested for iPad Pro 11" 834×1194 and 12.9" 1024×1366)
     landscape:  [ crayons | paper ]  [ info card ]
                                      [ controls  ]
     portrait:   [ info card ]
                 [ crayons | paper ]
                 [ controls ]                                                        */
  .chip { height: 84px; }
  .chip-sq { width: 84px; }
  .tab-btn { height: 70px; }
  .workspace { flex: 1 1 0; min-height: 0; display: grid; gap: 16px; padding: 6px 20px 18px; }
  .board-area { grid-area: board; min-width: 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  .info { grid-area: info; min-width: 0; }
  .controls { grid-area: controls; min-width: 0; }
  .card { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: #fff; border-radius: 28px; padding: 14px 18px; }
  .glyph-box { flex: none; width: 96px; height: 96px; display: grid; place-items: center; border-radius: 22px; background: #FFF4E6; }
  .card-text { flex: 1 1 0; min-width: 0; display: flex; gap: 12px; }
  .card-label { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .actions { display: flex; gap: 14px; }
  .act-row { display: flex; gap: 14px; flex: 1 1 0; min-width: 0; }
  .rail { display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #fff; border-radius: 40px; }

  @media (orientation: landscape) {
    .workspace { grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "board info" "board controls"; }
    .card-text { flex-direction: column; align-items: flex-start; }

    .actions { flex-direction: column; }
  }
  @media (orientation: portrait) {
    .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "info" "board" "controls"; }
    .card-text { flex-direction: row; align-items: center; justify-content: space-between; }
    .counter { flex: none; }
    /* one row of buttons: flatten the rows and order the buttons */
    .actions { gap: 12px; }
    .act-row { display: contents; }
    .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; }
    .landscape-only { display: none; }
  }
  /* Short landscape screens (iPad 11"): compact the top bars so the paper stays big */
  @media (orientation: landscape) and (max-height: 900px) {
    .chip { height: 74px; }
    .chip-sq { width: 74px; }
    .tab-btn { height: 60px; }
    .workspace { padding-top: 2px; }
  }

  /* Animations */
  .wipe { animation: wipe .45s ease-in forwards; transform-origin: 50% 50%; }
  @keyframes wipe { to { opacity: 0; transform: scale(.9) rotate(-3deg); filter: blur(8px); } }

  .stamp { position: absolute; left: 50%; top: 50%; pointer-events: none; animation: stamp 1.5s cubic-bezier(.2,1.4,.4,1) forwards; z-index: 5; }
  @keyframes stamp {
    0%   { transform: translate(-50%,-50%) scale(2.6) rotate(-25deg); opacity: 0; }
    22%  { transform: translate(-50%,-50%) scale(1) rotate(0deg);     opacity: 1; }
    78%  { transform: translate(-50%,-50%) scale(1.04);                opacity: 1; }
    100% { transform: translate(-50%,-62%) scale(.8);                  opacity: 0; }
  }

  .bubble { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 32% 30%, #fff 0 18%, rgba(186,230,253,.75) 45%, rgba(147,197,253,.35) 100%);
    border: 2px solid rgba(255,255,255,.9);
    animation: bubble .95s ease-out forwards; }
  @keyframes bubble { from { transform: translate(0,0) scale(.3); opacity: .95; } to { transform: translate(var(--dx), var(--dy)) scale(1.15); opacity: 0; } }

  .pop-in { animation: popin .45s cubic-bezier(.2,1.7,.4,1); display: inline-block; }
  @keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }

  .wiggle { animation: wiggle 1.1s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: scale(1) rotate(0); } 25% { transform: scale(1.06) rotate(-2deg); } 75% { transform: scale(1.06) rotate(2deg); } }

  .float { animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-14px); } }

  @media (prefers-reduced-motion: reduce) {
    .wiggle, .float { animation: none; }
  }
</style>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Boot guard (CDN failure)
  // ---------------------------------------------------------------------------
  if (!window.React || !window.ReactDOM || !window.htm) {
    document.getElementById('root').innerHTML =
      '<div style="height:100%;display:grid;place-items:center;text-align:center;font-size:28px;padding:24px">' +
      '🐣<br/>앱을 불러오지 못했어요.<br/><span style="font-size:20px;color:#888">인터넷 연결을 확인하고 새로고침 해 주세요.</span></div>';
    return;
  }

  const { useState, useEffect, useLayoutEffect, useRef, useMemo, forwardRef, useImperativeHandle } = React;
  const html = htm.bind(React.createElement);
  const Frag = React.Fragment;

  // ---------------------------------------------------------------------------
  // iPad gesture lockdown: no rubber-band scrolling, pinch zoom, or double-tap zoom
  // ---------------------------------------------------------------------------
  document.addEventListener('touchmove', (e) => {
    if (!(e.target.closest && e.target.closest('.scroll-x, .scroll-y'))) e.preventDefault();
  }, { passive: false });

  // Apple Pencil taps on buttons: iPadOS often never synthesizes a `click` for a Pencil tap (the Pencil
  // reports tiny movements, and the touchmove lock above cancels the tap gesture). So we detect the
  // Pencil tap ourselves and click the button, swallowing the native click if it does arrive.
  let penTap = null;
  let swallowClickUntil = 0;
  let ownClick = false;
  const penTapTarget = (e) => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    return b && !b.disabled ? b : null;
  };
  let swallowTarget = null;
  const firePenTap = (b) => {
    swallowClickUntil = performance.now() + 500;
    swallowTarget = b;
    ownClick = true;
    try { b.click(); } finally { ownClick = false; }
  };
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'pen') return;
    const b = penTapTarget(e);
    penTap = b ? { b, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now() } : null;
  }, true);
  document.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'pen' && penTap) { penTap.lx = e.clientX; penTap.ly = e.clientY; }
  }, true);
  document.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'pen' || !penTap) return;
    const { b, x, y } = penTap;
    penTap = null;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    if (Math.hypot(e.clientX - x, e.clientY - y) <= 30 && hit && b.contains(hit) && !b.disabled) firePenTap(b);
  }, true);
  // If the system turns a tiny Pencil wiggle into a "pan" it sends pointercancel instead of pointerup.
  document.addEventListener('pointercancel', (e) => {
    if (e.pointerType !== 'pen' || !penTap) return;
    const { b, x, y, lx, ly, t } = penTap;
    penTap = null;
    if (Math.hypot(lx - x, ly - y) <= 12 && performance.now() - t < 600 && !b.disabled) firePenTap(b);
  }, true);
  // Swallow the system's own (late) click for the same Pencil tap so the button doesn't fire twice.
  document.addEventListener('click', (e) => {
    if (!ownClick && performance.now() < swallowClickUntil && swallowTarget && swallowTarget.contains(e.target)) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button, input, textarea'))) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ---------------------------------------------------------------------------
  // Small utilities
  // ---------------------------------------------------------------------------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
  };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const hexA = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  const Icon = ({ name, size = 28, stroke = 2.6, className = '' }) => {
    const C = window.LucideReact && window.LucideReact[name];
    return C ? html`<${C} size=${size} strokeWidth=${stroke} className=${className} aria-hidden="true" />` : null;
  };

  // ---------------------------------------------------------------------------
  // Speech (tuned for a 5-year-old: slow + bright)
  // ---------------------------------------------------------------------------
  const Speech = (() => {
    const synth = window.speechSynthesis || null;
    let voice = null;
    let muted = false;
    const keep = []; // iOS: keep references so utterances aren't garbage-collected mid-sentence

    const NOVELTY = /(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|junior|ralph|fred|kathy)/i;
    function score(v) {
      const n = (v.name || '') + ' ' + (v.voiceURI || '');
      let s = 0;
      if (/siri/i.test(n)) s += 60;
      if (/yuna|유나/i.test(n)) s += 50;
      if (/premium|enhanced|프리미엄|향상|고음질/i.test(n)) s += 40;
      if (/natural|neural|online/i.test(n)) s += 45; // Edge "SunHi Online (Natural)" etc. — far less robotic
      if (/sunhi|seoyeon|jimin|sora/i.test(n)) s += 10;
      if (/google/i.test(n)) s += 8;               // still better than the old desktop voices below
      if (/heami/i.test(n)) s -= 5;                 // oldest Windows voice: very robotic
      if (v.localService) s += 2;
      if (NOVELTY.test(n)) s -= 80;
      return s;
    }
    let preferredURI = null;   // chosen in 설정; null = pick the best automatically
    let baseRate = 0.9;
    let onVoicesCb = null;
    const koVoices = () => (synth ? synth.getVoices().filter((v) => /^ko([-_]|$)/i.test(v.lang || '')) : [])
      .sort((a, b) => score(b) - score(a));
    const idOf = (v) => v.voiceURI || v.name;
    function load() {
      const ko = koVoices();
      if (!ko.length) return;
      voice = (preferredURI && ko.find((v) => idOf(v) === preferredURI)) || ko[0];
    }
    if (synth) {
      load();
      const changed = () => { load(); if (onVoicesCb) onVoicesCb(); };
      if (synth.addEventListener) synth.addEventListener('voiceschanged', changed);
      else synth.onvoiceschanged = changed;
    }
    // Must be called synchronously inside a tap handler at least once on iOS to unlock speech.
    // Slightly slow and only a touch brighter: a big pitch shift / very slow rate is what makes TTS sound robotic.
    // Prefer the natural AI voice file for this sentence; fall back to the device's TTS voice.
    // (voiceURI = "preview this device voice" from 설정, so it always uses TTS.)
    function say(text, opts = {}) {
      if (muted || !text) return;
      if (!opts.voiceURI && Clips.play(text, !!opts.queue, () => tts(text, opts))) {
        if (!opts.queue && synth && (synth.speaking || synth.pending)) synth.cancel();
        return;
      }
      if (!opts.queue) Clips.stop();
      tts(text, opts);
    }
    function tts(text, { rate, pitch = 1.05, queue = false, voiceURI } = {}) {
      if (!synth || muted || !text) return;
      if (!voice) load();
      if (!queue && (synth.speaking || synth.pending)) synth.cancel();
      // "|" part breaks → a comma pause ("우유의, 우!"), or just a space after ! ? .
      const u = new SpeechSynthesisUtterance(text.replace(/([!?.])\s*\|\s*/g, '$1 ').replace(/\s*\|\s*/g, ', '));
      u.lang = 'ko-KR';
      const v = (voiceURI && koVoices().find((x) => idOf(x) === voiceURI)) || voice;
      if (v) u.voice = v;
      u.rate = rate || baseRate;
      u.pitch = pitch;
      u.volume = 1;
      keep.push(u); if (keep.length > 6) keep.shift();
      try { synth.resume(); } catch (e) {}
      synth.speak(u);
    }
    // Human-friendly label: "Yuna (프리미엄)" etc.
    const quality = (v) => {
      const n = (v.name || '') + ' ' + (v.voiceURI || '');
      if (/premium|프리미엄/i.test(n)) return '프리미엄';
      if (/enhanced|향상/i.test(n)) return '향상됨';
      if (/natural|neural/i.test(n)) return '자연스러움';
      return '';
    };
    return {
      say,
      // iOS only lets a page speak after it has spoken once inside a tap; voice files may handle the
      // first sentences, so prime the TTS engine silently from the 시작하기 tap.
      unlock() { if (!synth) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {} },
      stop() { if (synth) synth.cancel(); Clips.stop(); },
      setMuted(m) { muted = m; if (m) { if (synth) synth.cancel(); Clips.stop(); } },
      setPreferred(uri) { preferredURI = uri || null; load(); },
      setRate(r) { baseRate = r; },
      currentURI() { if (!voice) load(); return voice ? idOf(voice) : null; },
      voices() { return koVoices().map((v) => ({ uri: idOf(v), name: v.name, quality: quality(v) })); },
      onVoices(cb) { onVoicesCb = cb; },
      supported: !!synth,
    };
  })();
  document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });

  // ---------------------------------------------------------------------------
  // Sound effects (synthesised with Web Audio; no audio files)
  // ---------------------------------------------------------------------------
  const Sfx = (() => {
    let ctx = null;
    let muted = false;
    let noiseBuf = null;
    function ac() {
      if (muted) return null;
      if (!ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ctx = new C();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(f, start, dur, { type = 'sine', vol = 0.15, to = null } = {}) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + start;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    return {
      setMuted(m) { muted = m; },
      context: () => ac(),
      unlock() {
        const c = ac(); if (!c) return;
        const b = c.createBuffer(1, 1, 22050);
        const s = c.createBufferSource();
        s.buffer = b; s.connect(c.destination); s.start(0);
      },
      pop() { tone(620, 0, 0.12, { vol: 0.12, to: 940 }); },
      tick() { tone(1175, 0, 0.18, { type: 'triangle', vol: 0.09 }); },
      clear() {
        tone(900, 0, 0.38, { vol: 0.1, to: 260 });
        tone(520, 0.12, 0.09, { vol: 0.08, to: 780 });
        tone(680, 0.22, 0.09, { vol: 0.07, to: 1000 });
        tone(840, 0.32, 0.09, { vol: 0.06, to: 1250 });
      },
      success() {
        [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.36, { type: 'triangle', vol: 0.14 }));
        tone(1568, 0.4, 0.55, { vol: 0.06 });
      },
      // Twinkly glitter that plays along with the confetti ("반짝반짝" as a sound, not a word)
      sparkle() {
        for (let i = 0; i < 9; i++) {
          const f = 1800 + Math.random() * 1600;
          tone(f, 0.35 + i * 0.07 + Math.random() * 0.03, 0.22, { vol: 0.045, to: f * 1.15 });
        }
      },
      // Three soft hand claps ("짝짝짝" as a sound): filtered noise bursts
      clap() {
        const c = ac(); if (!c) return;
        if (!noiseBuf) {
          noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.2), c.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        [0.45, 0.68, 0.91].forEach((start) => {
          const t0 = c.currentTime + start;
          const src = c.createBufferSource();
          const bp = c.createBiquadFilter();
          const g = c.createGain();

  // ---------------------------------------------------------------------------
  // Handwriting check: does the child's ink follow the guide strokes?
  // ---------------------------------------------------------------------------
  function evaluate(guide, user, { free = false, lenient = false } = {}) {
    const fail = { pass: false, coveredIdx: [], coverage: 0 };
    if (!user.length || !guide.length) return fail;
    let up = [];
    user.forEach((s) => { up = up.concat(resample(s.pts, 0.008)); });
    if (up.length < 4) return fail;
    const gs = guide.map((s) => resample(s, 0.015));

      // Free mode: compare shape only (child can write anywhere, any size)

      const k = gMax / uMax;
      up = up.map(([x, y]) => [gb.cx + (x - ub.cx) * k, gb.cy + (y - ub.cy) * k]);
    }

      for (let i = 0; i < arr.length; i++) {
        const dx = p[0] - arr[i][0], dy = p[1] - arr[i][1];
        if (dx * dx + dy * dy <= t2) return true;
      }
      return false;
    };

    const per = gs.map((g) => {
      let h = 0;
      for (const p of g) if (near(p, up, tc2)) h++;
      hit += h; tot += g.length;
      return h / g.length;
    });

    for (const p of up) if (near(p, all, tp2)) ph++;

      pass: coverage >= th.c && Math.min(...per) >= th.s && precision >= th.p,
      coverage, precision, per,
      coveredIdx: per.map((v, i) => (v >= 0.75 ? i : -1)).filter((i) => i >= 0),
    };

  function arrow(c, x, y, dir, a, color) {

    c.lineWidth = Math.max(2, a * 0.22);
    c.strokeStyle = '#fff';
    c.stroke();
    c.fillStyle = color;
    c.fill();
    c.restore();
  }

  function drawGuide(c, S, item, { showGrid, showGuide, covered }) {

      c.font = `${Math.round(S * 0.032)}px Jua, sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';

    const ANGLES = [0, 45, -45, 90, -90, 135, -135].map((a) => (a * Math.PI) / 180);
    list.forEach((s, i) => {

      if (!c || !SR.current) return;
      const p = P.current;
      drawGuide(c, SR.current, p.item, { showGrid: p.showGrid, showGuide: p.showGuide, covered: covered.current });
    }
    function inkStyle(c, color) {
      c.strokeStyle = color; c.fillStyle = color;
      c.lineWidth = SR.current * 0.042;
      c.lineCap = 'round'; c.lineJoin = 'round';
    }
    function renderInk() {
      const c = ctxOf(iC), s = SR.current;
      if (!c || !s) return;
      c.clearRect(0, 0, s, s);
      strokes.current.forEach((st) => {
        inkStyle(c, st.color);
        inkDot(c, st.pts[0], s);
        for (let i = 1; i < st.pts.length; i++) inkSeg(c, st.pts, i, s);
        inkTail(c, st.pts, s);
      });
    }
    function stopDemo() {
      demoTok.current++;
      clearTimeout(wipeT.current);
      const f = fC.current, c = ctxOf(fC);
      if (f) f.classList.remove('wipe');
      if (c) c.clearRect(0, 0, SR.current, SR.current);
    }
    function afterStroke() {
      const p = P.current;
      const free = !p.showGuide;
      const res = evaluate(p.item.strokes, strokes.current, { free });
      if (!free) {
        const fresh = res.coveredIdx.filter((i) => !covered.current.has(i));
        if (fresh.length) {
          fresh.forEach((i) => covered.current.add(i));
          renderGuide();
          if (!res.pass) Sfx.tick();
        }
      }
      if (res.pass && p.onSuccess) p.onSuccess();
    }

    // Measure available space → square canvas size
    useEffect(() => {
      const el = holder.current;
      // Keep room on both sides for the crayon rail so the paper stays centred.
      const measure = (w, h) => {
        const rail = P.current.railWidth ? 2 * (P.current.railWidth + RAIL_GAP) : 0;
        setS(Math.max(220, Math.floor(Math.min(w - rail - 2 * BORDER - 8, h - 2 * BORDER - 20))));
      };
      const ro = new ResizeObserver((entries) => {
        const r = entries[0].contentRect;
        measure(r.width, r.height);
      });
      ro.observe(el);
      return () => ro.disconnect();
    }, []);

    // (Re)configure canvases for the current size + device pixel ratio
    useLayoutEffect(() => {
      if (!S) return;
      SR.current = S;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      [gC, fC, iC].forEach((r) => {
        const cv = r.current;
        cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
        cv.style.width = S + 'px'; cv.style.height = S + 'px';
        cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      });
      renderGuide();
      renderInk();
    }, [S]);

    // New page / item → wipe everything
    useEffect(() => {
      stopDemo();
      strokes.current = [];
      covered.current = new Set();
      renderInk();
      renderGuide();
    }, [props.session]);

    useEffect(() => { renderGuide(); }, [props.item, props.showGrid, props.showGuide]);

    // Redraw guide once the Jua webfont is ready (badge numbers)
    useEffect(() => {
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderGuide());
    }, []);

    // Pointer input (finger + Apple Pencil, simple palm rejection)
    useEffect(() => {
      const el = pad.current;
      let active = null;
      let lastPen = -1e9;
      const toU = (e) => {
        const r = iC.current.getBoundingClientRect();
        return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
      };
      const down = (e) => {
        e.preventDefault();
        const now = performance.now();
        if (e.pointerType === 'pen') {
          lastPen = now;
          if (P.current.onPen) P.current.onPen();
        } else if (e.pointerType === 'touch') {
          // Palm rejection: in Pencil-only mode fingers/palms never draw; otherwise ignore touches
          // that land shortly after the Pencil was used.
          if (P.current.penOnly || now - lastPen < 1500) return;
        }
        if (P.current.locked) return;
        if (active) {
          if (e.pointerType === 'pen' && active.type !== 'pen') { strokes.current.pop(); renderInk(); }
          else return; // ignore extra fingers
        }
        stopDemo();
        active = { id: e.pointerId, type: e.pointerType };
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
        const st = { color: P.current.color, pts: [toU(e)] };
        strokes.current.push(st);
        const c = ctxOf(iC);
        inkStyle(c, st.color);
        inkDot(c, st.pts[0], SR.current);
      };
      const move = (e) => {
        if (!active || e.pointerId !== active.id) return;
        e.preventDefault();
        if (active.type === 'pen') lastPen = performance.now();
        const st = strokes.current[strokes.current.length - 1];
        if (!st) return;
        const c = ctxOf(iC);
        inkStyle(c, st.color);
        const co = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
        const list = co && co.length ? co : [e];
        for (const ev of list) {
          const p = toU(ev);
          const q = st.pts[st.pts.length - 1];
          if (dist(p, q) < 0.0025) continue;
          st.pts.push(p);
          inkSeg(c, st.pts, st.pts.length - 1, SR.current);
        }
      };
      const up = (e) => {
        if (!active || e.pointerId !== active.id) return;
        if (active.type === 'pen') lastPen = performance.now();
        active = null;
        const st = strokes.current[strokes.current.length - 1];
        if (st) {
          const c = ctxOf(iC);
          inkStyle(c, st.color);
          inkTail(c, st.pts, SR.current);
        }
        afterStroke();
      };
      const block = (e) => e.preventDefault();
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('touchstart', block, { passive: false });
      el.addEventListener('touchmove', block, { passive: false });
      return () => {
        el.removeEventListener('pointerdown', down);
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        el.removeEventListener('touchstart', block);
        el.removeEventListener('touchmove', block);
      };
    }, []);

    useImperativeHandle(ref, () => ({
      hasInk: () => strokes.current.length > 0,
      check: () => evaluate(P.current.item.strokes, strokes.current, { free: !P.current.showGuide, lenient: true }),
      clear(animated) {
        stopDemo();
        const s = SR.current;
        if (animated && strokes.current.length) {
          const f = fC.current, c = ctxOf(fC);
          c.drawImage(iC.current, 0, 0, s, s);
          void f.offsetWidth;
          f.classList.add('wipe');
          wipeT.current = setTimeout(() => { f.classList.remove('wipe'); c.clearRect(0, 0, SR.current, SR.current); }, 480);
        }
        if (animated) setPoof((p) => p + 1);
        strokes.current = [];
        covered.current = new Set();
        renderInk();
        renderGuide();
      },
      async demo() {
        stopDemo();
        const tok = demoTok.current;
        const c = ctxOf(fC), s = SR.current, it = P.current.item;
        if (!c || !s || !it) return;
        const list = it.strokes, lens = list.map(pathLen);
        const drawPart = (i, d) => {
          const { pts, p } = walk(list[i], d);
          c.beginPath();
          pts.forEach((q, k) => (k ? c.lineTo(q[0] * s, q[1] * s) : c.moveTo(q[0] * s, q[1] * s)));
          c.strokeStyle = hexA(colorOf(i), 0.85);
          c.lineWidth = s * 0.046; c.lineCap = 'round'; c.lineJoin = 'round';
          c.stroke();
          return p;
        };
        for (let i = 0; i < list.length; i++) {
          if (tok !== demoTok.current) return;
          Speech.say(NUM_KO[i] || String(i + 1));
          const dur = Math.max(700, (lens[i] / 0.5) * 1000);
          const ok = await tween(dur, (t) => {
            if (tok !== demoTok.current) return false;
            c.clearRect(0, 0, s, s);
            for (let j = 0; j < i; j++) drawPart(j, lens[j]);
            const head = drawPart(i, lens[i] * easeInOut(t));
            c.beginPath(); c.arc(head[0] * s, head[1] * s, s * 0.03, 0, Math.PI * 2);
            c.fillStyle = '#fff'; c.fill();
            c.lineWidth = s * 0.012; c.strokeStyle = colorOf(i); c.stroke();
            return true;
          });
          if (!ok) return;
          await sleep(350);
        }
        if (tok !== demoTok.current) return;
        c.clearRect(0, 0, s, s);
        for (let j = 0; j < list.length; j++) drawPart(j, lens[j]);
        await sleep(1100);
        if (tok === demoTok.current) c.clearRect(0, 0, s, s);
      },
    }));

    const bubbles = useMemo(() => {
      if (!poof) return [];
      return Array.from({ length: 12 }, (_, i) => {
        const a = (i / 12) * Math.PI * 2 + Math.random() * 0.4;
        const r = 60 + Math.random() * 120;
        return {
          k: poof + '-' + i,
          size: 18 + Math.random() * 34,
          left: 35 + Math.random() * 30 + '%',
          top: 35 + Math.random() * 30 + '%',
          dx: Math.cos(a) * r + 'px',
          dy: Math.sin(a) * r - 60 + 'px',
          delay: Math.random() * 0.15 + 's',
        };
      });
    }, [poof]);

    const outer = S + 2 * BORDER;
    return html`
      <div ref=${holder} className="board-area">
        <div className="relative" style=${{ width: outer, height: outer }}>
          <div ref=${pad} className="pad absolute inset-0 bg-white overflow-hidden"
               style=${{ borderRadius: 34, border: `${BORDER}px solid #FED7AA`, boxShadow: '0 10px 0 #FDBA74, 0 22px 44px rgba(251,146,60,.22)' }}
               aria-label="글씨 쓰는 곳">
            <canvas ref=${gC}></canvas>
            <canvas ref=${fC}></canvas>
            <canvas ref=${iC}></canvas>
          </div>
          ${bubbles.map((b) => html`<span key=${b.k} className="bubble"
              style=${{ width: b.size, height: b.size, left: b.left, top: b.top, '--dx': b.dx, '--dy': b.dy, animationDelay: b.delay }}></span>`)}
          ${props.rail && html`<div className="absolute top-1/2 -translate-y-1/2" style=${{ right: `calc(100% + ${RAIL_GAP}px)` }}>${props.rail}</div>`}
          ${props.children}
        </div>
      </div>`;
  });

  const MiniSvg = ({ strokes, size = 52, color = '#64748B', width = 0.075 }) => html`

  const STAR_CATS = [['lines', '선 긋기'], ['consonants', '자음'], ['vowels', '모음'], ['words', '낱말'], ['numbers', '숫자']];
  function catOf(key) {
    const t = key.slice(0, 2), v = key.slice(2);
    if (t === 'l:') return 'lines';

  // Press-and-hold button: fills up over `seconds`, fires only if held the whole time (no accidental taps).
  function HoldButton({ seconds = 3, onDone, children, className = '', disabled }) {
    const [p, setP] = useState(0);
    const raf = useRef(0);
    const t0 = useRef(0);
    const cancel = () => { cancelAnimationFrame(raf.current); setP(0); };
    const begin = (e) => {
      if (disabled) return;

      t0.current = performance.now();
      const tick = (t) => {
        const k = Math.min(1, (t - t0.current) / (seconds * 1000));
        setP(k);

        raf.current = requestAnimationFrame(tick);
      };
      raf.current = requestAnimationFrame(tick);
    };
    useEffect(() => cancel, []);
    return html`
      <button onPointerDown=${begin} onPointerUp=${cancel} onPointerLeave=${cancel} onPointerCancel=${cancel} disabled=${disabled}

    const penSeenRef = useRef(false);

    useEffect(() => { Speech.setMuted(muted); Sfx.setMuted(muted); store.set('monggeul.muted', muted); }, [muted]);
    useEffect(() => { Speech.setPreferred(prefs.voice); Speech.setRate(prefs.rate); Clips.setSpeed(prefs.rate); Clips.setEnabled(prefs.clips !== false); store.set('monggeul.prefs', prefs); }, [prefs]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3500); return () => clearTimeout(t); }, [toast]);

    const penOnly = prefs.pen === 'on' || (prefs.pen === 'auto' && penSeen);
    function onPen() {
      if (penSeenRef.current) return;
      penSeenRef.current = true;
      setPenSeen(true);
      if (prefs.pen === 'auto') setToast('✏️ 펜슬 전용 모드가 켜졌어요. 손바닥이 닿아도 그려지지 않아요.');
    }

    const isPractice = tab === 'practice';
    const tabList = tab === 'words' ? WORD_THEMES[wTheme].items : ITEMS[tab]; // 낱말: only the chosen theme
    const word = tab === 'words' ? tabList[idx.words] : null;
    const pItems = PCATS[pCat].items;
    const current = isPractice ? pItems[pIdx] : word ? word.syllables[syl] : ITEMS[tab][idx[tab]];
    const pickerItems = isPractice ? pItems : tabList;
    const pickerActive = isPractice ? pIdx : idx[tab];
    const total = useMemo(() => Object.keys(progress).filter((k) => !k.startsWith('w:')).reduce((a, k) => a + progress[k], 0), [progress]);
    const showGuide = isPractice ? grid : true;

    // ---- helpers
    const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
    const later = (ms, fn) => timers.current.push(setTimeout(fn, ms));
    const navigate = (update) => {
      clearTimers();
      doneRef.current = false;
      setDone(false);
      setWordDone(false);
      update();
      setSession((s) => s + 1);
      setNavId((n) => n + 1);
    };
    const bump = (key) => setProgress((p) => {
      const n = { ...p, [key]: (p[key] || 0) + 1 };
      Profiles.saveProgress(profileId, n);
      return n;
    });

    // ---- profiles (managed in 설정; kids only pick who they are)
    function switchProfile(id) {
      if (id === profileId) return;
      Profiles.setActive(id);
      setProfileId(id);
      setProgress(Profiles.progress(id));
      navigate(() => setReps(0));
      const p = profiles.find((x) => x.id === id);
      if (p) setToast(`${p.icon} ${p.name} 차례예요!`);
    }
    const saveProfiles = (list) => { setProfiles(list); Profiles.save(list); };
    const profileOps = {
      add() {
        if (profiles.length >= MAX_PROFILES) return;
        const icon = AVATARS.find((a) => !profiles.some((p) => p.icon === a)) || AVATARS[0];
        saveProfiles([...profiles, { id: 'p' + Date.now().toString(36), name: `친구 ${profiles.length + 1}`, icon }]);
      },
      rename(id, name) { saveProfiles(profiles.map((p) => (p.id === id ? { ...p, name: name.slice(0, 8) } : p))); },
      nextIcon(id) {
        saveProfiles(profiles.map((p) => (p.id === id ? { ...p, icon: AVATARS[(AVATARS.indexOf(p.icon) + 1) % AVATARS.length] } : p)));
      },
      remove(id) {
        if (profiles.length <= 1) return;
        const list = profiles.filter((p) => p.id !== id);
        saveProfiles(list);
        Profiles.drop(id);
        if (id === profileId) {
          Profiles.setActive(list[0].id);
          setProfileId(list[0].id);
          setProgress(Profiles.progress(list[0].id));
        }
        setToast('프로필을 지웠어요');
      },
      progressOf: (id) => (id === profileId ? progress : Profiles.progress(id)),
      // cat = null → all stars; otherwise one tab's stars
      resetStars(id, cat) {
        const src = id === profileId ? progress : Profiles.progress(id);
        const kept = cat ? Object.fromEntries(Object.entries(src).filter(([k]) => catOf(k) !== cat)) : {};
        Profiles.saveProgress(id, kept);
        if (id === profileId) setProgress(kept);
        Sfx.clear();
        const label = cat ? STAR_CATS.find(([c]) => c === cat)[1] + ' ' : '';
        setToast(`🗑️ ${label}별 기록을 지웠어요`);
      },
    };

    // Speak the new item's prompt after every navigation
    useEffect(() => {
      if (!started || !navId) return;
      if (word && syl === 0) Speech.say(SAY.wordIntro(word, current));
      else Speech.say(current.speak);
    }, [navId]);

    // ---- actions
    function start(id) {
      Sfx.unlock();
      Sfx.pop();
      Speech.unlock();
      Clips.unlock();
      Speech.say(SAY.welcome);
      Clips.preloadAll();
      if (id && id !== profileId) {
        Profiles.setActive(id);
        setProfileId(id);
        setProgress(Profiles.progress(id));
      }
      setStarted(true);
    }
    function selectTab(id) {
      Sfx.pop();
      if (id === tab) return;
      navigate(() => { setTab(id); setSyl(0); setReps(0); });
    }
    function pickItem(i) {
      Sfx.pop();
      navigate(() => {
        if (isPractice) { setPIdx(i); setReps(0); }
        else { setIdx((o) => ({ ...o, [tab]: i })); setSyl(0); }
      });
    }
    function pickCat(i) {
      Sfx.pop();
      if (i === pCat) return;
      navigate(() => { setPCat(i); setPIdx(0); setReps(0); });
    }
    function pickTheme(i) {
      Sfx.pop();
      if (i === wTheme) return;
      navigate(() => { setWTheme(i); setIdx((o) => ({ ...o, words: 0 })); setSyl(0); });
    }
    function next() {
      Sfx.pop();
      navigate(() => {
        if (isPractice) { setPIdx((i) => (i + 1) % pItems.length); setReps(0); }
        else { setIdx((o) => ({ ...o, [tab]: (o[tab] + 1) % tabList.length })); setSyl(0); }
      });
    }
    function prev() {
      Sfx.pop();
      navigate(() => {
        if (isPractice) { setPIdx((i) => (i - 1 + pItems.length) % pItems.length); setReps(0); }
        else { setIdx((o) => ({ ...o, [tab]: (o[tab] - 1 + tabList.length) % tabList.length })); setSyl(0); }
      });
    }
    function pickSyllable(i) {
      Sfx.pop();
      if (i !== syl) navigate(() => setSyl(i));
    }
    function refresh() {
      clearTimers();
      if (board.current) board.current.clear(true);
      Sfx.clear();
      Speech.say(SAY.retry);
      doneRef.current = false;
      setDone(false);
      setWordDone(false);
    }
    function listen() {
      Sfx.pop();
      if (word && syl === 0) Speech.say(SAY.wordIntro(word, current));
      else Speech.say(current.speak);
    }
    function demo() {
      Sfx.pop();
      if (board.current) board.current.demo();
    }
    function check() {
      Sfx.pop();
      if (doneRef.current || !board.current) return;
      if (!board.current.hasInk()) { Speech.say(SAY.inkFirst); return; }
      if (board.current.check().pass) onSuccess();
      else Speech.say(SAY.almost);
    }
    function toggleGrid() {
      Sfx.pop();
      const on = !grid;
      clearTimers();
      doneRef.current = false;
      setDone(false);
      setGrid(on);
      setSession((s) => s + 1);
      // No voice here: the ON/OFF badge and the pop sound are feedback enough.
    }
    // Celebrations use real sound effects (chime, sparkle, clapping) — the voice only says words.
    function onSuccess() {
      if (doneRef.current) return;
      doneRef.current = true;
      setDone(true);
      Sfx.success();
      Sfx.sparkle();
      setStamp((s) => s + 1);
      bump(current.key);

      if (isPractice) {
        const n = reps + 1;
        const milestone = n % 5 === 0;
        setReps(n);
        burst(milestone);
        if (milestone) {
          Sfx.clap();
          later(700, () => Speech.say(SAY.milestone(n)));
        }
        later(milestone ? 3200 : 1800, () => {
          if (board.current) board.current.clear(true);
          Sfx.clear();
          doneRef.current = false;
          setDone(false);
        });
      } else if (word) {
        if (syl < word.syllables.length - 1) {
          burst(false);
          later(1500, () => navigate(() => setSyl((s) => s + 1))); // next syllable's prompt is spoken on arrival
        } else {
          burst(true);
          bump(word.key);
          setWordDone(true);
          Sfx.clap();
          later(700, () => Speech.say(SAY.wordDone(word)));
        }
      } else {
        burst(false);
        Sfx.clap();
        later(700, () => Speech.say(pick(PRAISE)));
      }
    }

    // ---- view pieces
    const tabsView = html`
      <nav className="grid gap-2.5 px-4 pb-1" style=${{ gridTemplateColumns: `repeat(${TABS.length}, minmax(0, 1fr))` }} role="tablist">
        ${TABS.map((t) => {
          const on = t.id === tab;
          return html`<button key=${t.id} role="tab" aria-selected=${on} onClick=${() => selectTab(t.id)}
              className="btn3d tab-btn min-w-0 rounded-3xl flex items-center justify-center gap-1.5 text-[21px] border-4"
              style=${on ? { background: t.color, color: '#fff', borderColor: t.color, boxShadow: `0 6px 0 ${t.shadow}` }
                         : { background: '#fff', color: t.shadow, borderColor: '#FFEBD6' }}>
              ${t.icon ? html`<${Icon} name=${t.icon} size=${26} />` : html`<span className="text-[26px] leading-none">${t.glyph}</span>`}
              <span className="whitespace-nowrap">${t.label}</span>
            </button>`;
        })}
      </nav>`;

    const catPills = isPractice ? html`
      <div className="flex-none flex gap-2 pr-2 border-r-4 border-dashed border-violet-100">
        ${PCATS.map((c, i) => html`<button key=${c.id} onClick=${() => pickCat(i)}
            className="chip min-w-[66px] px-2 rounded-2xl text-[21px] border-4"
            style=${i === pCat ? { background: '#A78BFA', color: '#fff', borderColor: '#A78BFA' } : { background: '#fff', color: '#7C3AED', borderColor: '#EDE9FE' }}>${c.label}</button>`)}
      </div>`
    : tab === 'words' ? html`
      <div className="flex-none flex gap-2 pr-2 border-r-4 border-dashed border-pink-100" role="tablist" aria-label="낱말 주제">
        ${WORD_THEMES.map((t, i) => html`<button key=${t.id} onClick=${() => pickTheme(i)} role="tab" aria-selected=${i === wTheme} aria-label=${t.label}
            className="chip w-[70px] rounded-2xl border-4 flex flex-col items-center justify-center gap-1"
            style=${i === wTheme ? { background: '#F472B6', color: '#fff', borderColor: '#F472B6' } : { background: '#fff', color: '#DB2777', borderColor: '#FCE7F3' }}>
            <span className="text-[28px] leading-none">${t.icon}</span>
            <span className="text-[14px] leading-none whitespace-nowrap">${t.label}</span>
          </button>`)}
      </div>`
    : null;

    // Model card: what to write
    let glyph, label;
    if (word) {
      glyph = html`<span className="text-[66px] leading-none">${word.emoji}</span>`;
      label = html`
        <div className="flex gap-2 flex-wrap">
          ${word.syllables.map((s, i) => {
            const isDone = i < syl || (i === syl && done);
            const on = i === syl;
            return html`<button key=${i} onClick=${() => pickSyllable(i)} aria-label=${s.glyph}
                className="relative w-[60px] h-[60px] rounded-2xl text-[36px] leading-none grid place-items-center border-4"
                style=${{ background: isDone ? '#DCFCE7' : on ? '#FFF7ED' : '#fff', borderColor: on ? '#FB923C' : isDone ? '#86EFAC' : '#F1F5F9', color: on ? '#EA580C' : '#4A3F5C' }}>
                ${s.glyph}
                ${isDone && html`<span className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-green-500 text-white text-[14px] grid place-items-center">✓</span>`}
              </button>`;
          })}
        </div>`;
    } else {
      const gSize = current.glyph && current.glyph.length >= 3 ? 40 : current.glyph && current.glyph.length === 2 ? 54 : 72;
      glyph = current.kind === 'line'
        ? html`<${MiniSvg} strokes=${current.strokes} size=${76} color="#FB923C" width=${0.07} />`
        : html`<span className="leading-none text-orange-500" style=${{ fontSize: gSize }}>${current.glyph}</span>`;
      label = html`<${Frag}>
        <div className="text-[32px] leading-none">${current.name}</div>
        ${current.kind === 'number'
          ? html`<${CountPicture} n=${current.count} />`
          : current.kind !== 'line' && html`<div className="text-[22px] leading-none text-slate-500">${current.emoji} ${current.word}</div>`}
      <//>`;
    }

    const filled = reps === 0 ? 0 : ((reps - 1) % 10) + 1;
    const trophies = Math.floor(reps / 10);
    const counter = isPractice && html`
      <div className="counter rounded-[22px] bg-amber-50 px-4 py-2">
        <div className="flex items-center justify-between gap-3">
          <div className="text-[32px] text-amber-500 leading-none whitespace-nowrap">⭐ × <span key=${reps} className="pop-in">${reps}</span></div>
          ${trophies > 0 && html`<div className="text-[22px] text-amber-600 whitespace-nowrap">🏆 × ${trophies}</div>`}
        </div>
        <div className="flex gap-0.5 mt-1.5">
          ${Array.from({ length: 10 }, (_, i) => html`<span key=${i + '-' + (i < filled ? reps : 0)}
              className=${'text-[18px] leading-none ' + (i < filled ? 'pop-in' : '')}
              style=${{ filter: i < filled ? 'none' : 'grayscale(1) opacity(.25)' }}>⭐</span>`)}
        </div>
      </div>`;

    const card = html`
      <div className="card soft">
        <div className="glyph-box">${glyph}</div>
        <div className="card-text">
          <div className="card-label">${label}</div>
          <${BigBtn} onClick=${listen} bg="#fff" fg="#0284C7" border="#BAE6FD" icon="Volume2" className="flex-none">들어 보기<//>
        </div>
        ${counter}
      </div>`;

    const gridToggle = html`
      <button onClick=${toggleGrid} aria-pressed=${grid} aria-label="칸 도우미"
          className="btn3d o5 flex-1 min-w-0 h-[64px] rounded-[22px] px-4 flex items-center justify-center gap-2 text-[21px] leading-none border-4"
          style=${grid ? { background: '#F5F3FF', borderColor: '#C4B5FD', color: '#6D28D9' } : { background: '#fff', borderColor: '#E2E8F0', color: '#64748B' }}>
        <${Icon} name="Grid2x2" size=${26} />
        <span className="whitespace-nowrap">칸 도우미</span>
        <span className="ml-1 px-2 py-1 rounded-full text-[15px] text-white" style=${{ background: grid ? '#8B5CF6' : '#94A3B8' }}>${grid ? 'ON' : 'OFF'}</span>
      </button>`;

    // Secondary actions are outlined, the one thing to do next is solid.
    // portrait : one row   [따라 보기][다 했어요][◀][다시 쓰기][다음]        (o1…o5 set the order)
    // landscape: 3 rows    [따라 보기][다 했어요] / [◀][다음 낱말] / [다시 쓰기]
    const nextLabel = html`<${Frag}>다음${word ? html`<span className="landscape-only"> 낱말</span>` : ''}<//>`;
    const controls = html`
      <div className="actions">
        <div className="act-row">
          <${BigBtn} onClick=${demo} bg="#fff" fg="#0284C7" border="#BAE6FD" icon="Play" className="flex-1 o1">따라 보기<//>
          <${BigBtn} onClick=${check} bg="#22C55E" icon="Check" disabled=${done} className="flex-1 o2">다 했어요<//>
        </div>
        <div className="act-row">
          ${isPractice ? gridToggle : html`<${Frag}>
            <${BigBtn} onClick=${prev} bg="#fff" fg="#64748B" border="#E2E8F0" icon="ChevronLeft" label="이전" className="w-[64px] flex-none !px-0 o3" />
            <${BigBtn} onClick=${next} bg="#A78BFA" icon="ChevronRight" label=${word ? '다음 낱말' : '다음'}
                       pulse=${done && (!word || wordDone)} className="flex-1 o5">${nextLabel}<//>
          <//>`}
        </div>
        <div className="act-row">
          <${BigBtn} onClick=${refresh} bg="#FB923C" icon="RotateCcw" className="flex-1 o4">다시 쓰기<//>
        </div>
      </div>`;

    // Crayons live in a vertical rail beside the paper (uses the spare width, keeps the bottom calm)
    const rail = html`
      <div className="rail soft" role="radiogroup" aria-label="크레파스 색깔">
        ${CRAYONS.map((c) => html`<button key=${c} role="radio" aria-checked=${c === color} onClick=${() => { Sfx.pop(); setColor(c); }} aria-label="색깔"
            className="w-[58px] h-[58px] rounded-full grid place-items-center transition-transform"
            style=${{ background: c, transform: c === color ? 'scale(1)' : 'scale(.82)', boxShadow: c === color ? `0 0 0 4px #fff, 0 0 0 7px ${c}` : 'none' }}>
            ${c === color && html`<${Icon} name="Check" size=${28} className="text-white" />`}
          </button>`)}
      </div>`;

    return html`
      <div className="h-full flex flex-col"
           style=${{ paddingTop: 'env(safe-area-inset-top)', paddingBottom: 'env(safe-area-inset-bottom)', paddingLeft: 'env(safe-area-inset-left)', paddingRight: 'env(safe-area-inset-right)' }}>
        <header className="flex items-center gap-3 px-5 pt-3 pb-3">
          <div className="w-[56px] h-[56px] rounded-2xl grid place-items-center text-[34px] soft flex-none" style=${{ background: 'linear-gradient(135deg,#FECDD3,#FED7AA)' }}>🐣</div>
          <h1 className="title-grad text-[28px] leading-none whitespace-nowrap">몽글몽글 한글 쓰기</h1>
          <div className="flex-1"></div>
          <button onClick=${() => { Sfx.pop(); setPickerOpen(true); }} aria-label=${`${profile.name}, 모은 별 ${total}개. 누르면 다른 친구로 바꿔요`}
                  className="btn3d h-[60px] pl-2 pr-4 rounded-full bg-yellow-100 border-4 border-yellow-300 flex items-center gap-1.5 text-[24px] text-amber-600 flex-none">
            <span className="w-[42px] h-[42px] rounded-full bg-white grid place-items-center text-[28px] leading-none">${profile.icon}</span>
            <span>⭐</span><span key=${total} className="pop-in">${total}</span>
          </button>
          <button onClick=${() => { setMuted((m) => !m); }} aria-label=${muted ? '소리 켜기' : '소리 끄기'}
                  className="btn3d w-[60px] h-[60px] rounded-full bg-white border-4 border-orange-100 grid place-items-center text-slate-500 flex-none">
            <${Icon} name=${muted ? 'VolumeX' : 'Volume2'} size=${28} />
          </button>
          <button onClick=${() => { Sfx.pop(); setSettingsOpen(true); }} aria-label="설정"
                  className="btn3d w-[60px] h-[60px] rounded-full bg-white border-4 border-orange-100 grid place-items-center text-slate-500 flex-none">
            <${Icon} name="Settings" size=${28} />
          </button>
          <button onClick=${refresh} className="btn3d h-[60px] px-5 rounded-full bg-orange-400 text-white text-[22px] flex items-center gap-2 flex-none">
            <${Icon} name="RotateCcw" size=${26} /> 다시 쓰기
          </button>
        </header>

        ${tabsView}

        <${PickerBar} items=${pickerItems} active=${pickerActive} onPick=${pickItem} progress=${progress} lead=${catPills} />

        <div className="workspace">
          <section className="info">${card}</section>
          <${Board} ref=${board} item=${current} session=${session} showGrid=${showGuide} showGuide=${showGuide}
                    color=${color} locked=${done} onSuccess=${onSuccess} penOnly=${penOnly} onPen=${onPen}
                    rail=${rail} railWidth=${78}>
            ${stamp > 0 && html`
              <div key=${stamp} className="stamp text-center">
                <div className="text-[150px] leading-none" style=${{ filter: 'drop-shadow(0 8px 0 rgba(234,179,8,.35))' }}>⭐</div>
                <div className="text-[36px] text-amber-500 whitespace-nowrap" style=${{ textShadow: '0 3px 0 #fff' }}>참 잘했어요!</div>
              </div>`}
          <//>
          <section className="controls">${controls}</section>
        </div>

        ${toast && html`<div key=${toast} className="pop-in fixed left-1/2 top-6 -translate-x-1/2 z-40 px-6 py-3 rounded-full bg-slate-700/90 text-white text-[20px] shadow-lg whitespace-nowrap">${toast}</div>`}
        ${pickerOpen && html`
          <div className="fixed inset-0 z-50 bg-slate-900/40 grid place-items-center p-6" onClick=${(e) => { if (e.target === e.currentTarget) setPickerOpen(false); }}>
            <div className="bg-[#FFF8EE] rounded-[32px] p-8 max-w-[760px] shadow-2xl relative">
              <button onClick=${() => { Sfx.pop(); setPickerOpen(false); }} aria-label="닫기"
                      className="btn3d absolute top-4 right-4 w-[60px] h-[60px] rounded-full bg-white border-4 border-orange-100 grid place-items-center text-slate-500">
                <${Icon} name="X" size=${28} />
              </button>
              <${ProfilePicker} profiles=${profiles} activeId=${profileId} title="누가 쓸까요?"
                                onPick=${(id) => { Sfx.pop(); setPickerOpen(false); switchProfile(id); }} />
              <p className="text-[17px] text-slate-400 text-center mt-6">친구 추가·이름 바꾸기·별 기록 지우기는 ⚙️ 설정에서 할 수 있어요</p>
            </div>
          </div>`}
        ${settingsOpen && html`<${Settings} prefs=${prefs} setPrefs=${setPrefs} penSeen=${penSeen} penOnly=${penOnly}
              profiles=${profiles} profileId=${profileId} ops=${profileOps}
              onClose=${() => { Sfx.pop(); setSettingsOpen(false); }} />`}
        ${!started && html`<${Splash} onStart=${start} profiles=${profiles} activeId=${profileId} />`}
      </div>`;
  }

  // ---------------------------------------------------------------------------
  // 설정 (for parents): voice, speaking speed, Pencil-only mode
  // ---------------------------------------------------------------------------
  function Settings({ prefs, setPrefs, penSeen, penOnly, onClose, profiles, profileId, ops }) {
    const [resetFor, setResetFor] = useState(profileId); // whose stars the 지우기 buttons act on
    const resetProfile = profiles.find((p) => p.id === resetFor) || profiles[0];
    const resetProgress = ops.progressOf(resetProfile.id);
    const [voices, setVoices] = useState(() => Speech.voices());
    const [current, setCurrent] = useState(() => Speech.currentURI());
    useEffect(() => {
      const upd = () => { setVoices(Speech.voices()); setCurrent(Speech.currentURI()); };
      Speech.onVoices(upd);
      const t = setTimeout(upd, 700); // iOS sometimes fills the list late
      return () => { clearTimeout(t); Speech.onVoices(null); };
    }, []);
    useEffect(() => { setCurrent(Speech.currentURI()); }, [prefs.voice]);

    const set = (patch) => { Sfx.pop(); setPrefs((p) => ({ ...p, ...patch })); };
    const sample = (uri) => Speech.say('안녕! 나랑 같이 한글 써 볼까? 기역! 기차의, 기!', { voiceURI: uri, queue: false });
    const hasPremium = voices.some((v) => v.quality === '프리미엄' || v.quality === '향상됨');
    const clipInfo = Clips.info();

    const Seg = ({ value, options, onPick }) => html`
      <div className="grid gap-2" style=${{ gridTemplateColumns: `repeat(${options.length}, 1fr)` }}>
        ${options.map(([v, text]) => html`<button key=${String(v)} onClick=${() => onPick(v)}
            className="h-[60px] rounded-2xl border-4 text-[20px]"
            style=${value === v ? { background: '#FFF7ED', borderColor: '#FB923C', color: '#C2410C' } : { background: '#fff', borderColor: '#F1F5F9', color: '#64748B' }}>${text}</button>`)}
      </div>`;

    return html`
      <div className="fixed inset-0 z-50 bg-slate-900/40 grid place-items-center p-6" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="bg-[#FFF8EE] rounded-[32px] w-full max-w-[640px] max-h-[88vh] flex flex-col shadow-2xl">
          <div className="flex items-center gap-3 px-6 pt-5 pb-3">
            <${Icon} name="Settings" size=${30} className="text-orange-400" />
            <h2 className="text-[30px] flex-1">설정 <span className="text-[18px] text-slate-400">(어른용)</span></h2>
            <button onClick=${onClose} aria-label="닫기" className="btn3d w-[60px] h-[60px] rounded-full bg-white border-4 border-orange-100 grid place-items-center text-slate-500">
              <${Icon} name="X" size=${28} />
            </button>
          </div>

          <div className="scroll-y px-6 pb-6 flex flex-col gap-6">
            <section>
              <h3 className="text-[22px] mb-2">👧 아이 프로필 <span className="text-[16px] text-slate-400">(최대 ${MAX_PROFILES}명 · 별 기록은 이 iPad에만 저장돼요)</span></h3>
              <div className="flex flex-col gap-2">
                ${profiles.map((p) => html`<div key=${p.id} className="flex items-center gap-2 bg-white rounded-2xl p-2 border-4"
                      style=${{ borderColor: p.id === profileId ? '#FED7AA' : '#F8FAFC' }}>
                    <button onClick=${() => { Sfx.pop(); ops.nextIcon(p.id); }} aria-label="아이콘 바꾸기"
                            className="w-[60px] h-[60px] rounded-2xl bg-orange-50 text-[38px] leading-none grid place-items-center flex-none">${p.icon}</button>
                    <input type="text" value=${p.name} maxLength=${8} aria-label="이름"
                           onInput=${(e) => ops.rename(p.id, e.target.value)}
                           className="flex-1 min-w-0 h-[56px] px-3 rounded-xl bg-slate-50 text-[22px] outline-none focus:ring-4 ring-orange-200" />
                    <span className="text-[18px] text-amber-600 whitespace-nowrap px-1">⭐ ${starsOf(ops.progressOf(p.id))}</span>
                    ${profiles.length > 1 && html`<${HoldButton} seconds=${3} onDone=${() => ops.remove(p.id)} className="h-[56px] px-3 text-[16px] flex-none">
                        <${Icon} name="Trash2" size=${20} /> 꾹 3초<//>`}
                  </div>`)}
                ${profiles.length < MAX_PROFILES && html`<button onClick=${() => { Sfx.pop(); ops.add(); }}
                    className="h-[60px] rounded-2xl border-4 border-dashed border-orange-200 text-orange-500 text-[20px] flex items-center justify-center gap-2">
                    <${Icon} name="Plus" size=${24} /> 새 친구 추가</button>`}
              </div>
              <p className="text-[15px] text-slate-400 mt-2">동물을 누르면 아이콘이 바뀌어요. 프로필 삭제는 휴지통 버튼을 3초 동안 꾹 누르세요.</p>
            </section>

            <section>
              <h3 className="text-[22px] mb-2">⭐ 별 기록 지우기</h3>
              ${profiles.length > 1 && html`<div className="flex gap-2 mb-3 flex-wrap">
                ${profiles.map((p) => html`<button key=${p.id} onClick=${() => { Sfx.pop(); setResetFor(p.id); }}
                    className="h-[52px] px-3 rounded-2xl border-4 text-[19px] flex items-center gap-1"
                    style=${p.id === resetProfile.id ? { background: '#FFF7ED', borderColor: '#FB923C' } : { background: '#fff', borderColor: '#F1F5F9' }}>
                    <span className="text-[26px]">${p.icon}</span>${p.name}</button>`)}
              </div>`}
              <div className="grid grid-cols-3 gap-2">
                <${HoldButton} onDone=${() => ops.resetStars(resetProfile.id, null)} disabled=${!starsOf(resetProgress)}
                               className="col-span-3 h-[60px] text-[20px]">
                  <${Icon} name="Trash2" size=${22} /> ${resetProfile.icon} ${resetProfile.name} 별 모두 지우기 (⭐ ${starsOf(resetProgress)})
                <//>
                ${STAR_CATS.map(([cat, label]) => html`<${HoldButton} key=${cat} onDone=${() => ops.resetStars(resetProfile.id, cat)}
                    disabled=${!starsOf(resetProgress, cat)} className="h-[60px] text-[18px]">
                    ${label} <span className="text-amber-600">⭐ ${starsOf(resetProgress, cat)}</span>
                  <//>`)}
              </div>
              <p className="text-[15px] text-slate-400 mt-2">아이가 실수로 지우지 않도록, 버튼을 <b>3초 동안 꾹</b> 눌러야 지워져요.</p>
            </section>

            <section>
              <h3 className="text-[22px] mb-2">🎙️ AI 음성 파일</h3>
              ${clipInfo
                ? html`<${Frag}>
                    <${Seg} value=${prefs.clips !== false} onPick=${(v) => set({ clips: v })}
                            options=${[[true, 'AI 음성 사용'], [false, '기기 음성 사용']]} />
                    <p className="text-[16px] text-slate-500 mt-2">${clipInfo.count}개 문장 · 목소리 ${clipInfo.voice}. 파일이 없는 문장만 아래 기기 음성으로 말해요.</p>
                  <//>`
                : html`<p className="text-[17px] text-slate-500">아직 AI 음성 파일이 없어서 아래 기기 음성으로 말해요.</p>`}
            </section>

            <section>
              <h3 className="text-[22px] mb-2">🗣️ 기기 음성 <span className="text-[16px] text-slate-400">(AI 음성 파일이 없을 때)</span></h3>
              ${!Speech.supported && html`<p className="text-[18px] text-red-500">이 브라우저는 음성 기능을 지원하지 않아요.</p>`}
              <div className="flex flex-col gap-2">
                <button onClick=${() => set({ voice: null })}
                    className="h-[64px] rounded-2xl border-4 px-4 flex items-center gap-3 text-[20px] text-left"
                    style=${prefs.voice === null ? { background: '#FFF7ED', borderColor: '#FB923C' } : { background: '#fff', borderColor: '#F1F5F9' }}>
                  <span className="flex-1">자동 선택 <span className="text-slate-400 text-[16px]">(가장 좋은 목소리)</span></span>
                </button>
                ${voices.map((v) => {
                  const chosen = prefs.voice === v.uri;
                  const inUse = current === v.uri;
                  return html`<div key=${v.uri} className="flex gap-2">
                    <button onClick=${() => set({ voice: v.uri })}
                        className="flex-1 min-w-0 h-[64px] rounded-2xl border-4 px-4 flex items-center gap-2 text-[20px] text-left"
                        style=${chosen ? { background: '#FFF7ED', borderColor: '#FB923C' } : { background: '#fff', borderColor: '#F1F5F9' }}>
                      <span className="truncate">${v.name}</span>
                      ${v.quality && html`<span className="flex-none px-2 py-0.5 rounded-full bg-violet-100 text-violet-600 text-[15px]">${v.quality}</span>`}
                      ${inUse && html`<span className="flex-none ml-auto px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-[15px]">사용 중</span>`}
                    </button>
                    <button onClick=${() => sample(v.uri)} aria-label=${v.name + ' 미리 듣기'}
                        className="btn3d flex-none w-[64px] h-[64px] rounded-2xl bg-sky-400 text-white grid place-items-center">
                      <${Icon} name="Play" size=${26} />
                    </button>
                  </div>`;
                })}
                ${Speech.supported && voices.length === 0 && html`<p className="text-[18px] text-slate-500">한국어 목소리를 찾는 중이에요… 잠시 뒤 다시 열어 주세요.</p>`}
              </div>
              ${!hasPremium && html`
                <div className="mt-3 rounded-2xl bg-white p-4 text-[17px] leading-relaxed text-slate-600">
                  <b>Yuna 프리미엄/향상됨</b>이 목록에 없나요?<br/>
                  ① iPad <b>설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 한국어</b>에서 Yuna (프리미엄)을 내려받고<br/>
                  ② 이 앱(또는 Safari)을 앱 전환기에서 <b>완전히 닫았다가</b> 다시 열어 주세요.<br/>
                  <span className="text-slate-400">그래도 목록에 없으면, iPadOS가 웹 페이지에는 그 목소리를 열어 주지 않는 경우예요.</span>
                </div>`}
            </section>

            <section>
              <div className="flex items-baseline gap-3 mb-1">
                <h3 className="text-[22px] flex-1">🐢 말 빠르기</h3>
                <span className="text-[30px] text-orange-500 tabular-nums">${prefs.rate.toFixed(2)}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-[30px]" aria-hidden="true">🐢</span>
                <input type="range" className="big-range flex-1" min="0.5" max="1" step="0.05" value=${prefs.rate}
                       aria-label="말 빠르기" aria-valuetext=${prefs.rate.toFixed(2)}
                       onChange=${(e) => { const r = Number(e.target.value); Speech.setRate(r); Clips.setSpeed(r); setPrefs((p) => ({ ...p, rate: r })); }}
                       onPointerUp=${() => Speech.say(ITEMS.consonants[0].speak)}
                       onKeyUp=${() => Speech.say(ITEMS.consonants[0].speak)} />
                <span className="text-[30px]" aria-hidden="true">🐇</span>
              </div>
              <div className="flex justify-between text-[15px] text-slate-400 px-12">
                <span>0.5 아주 천천히</span><span>0.75</span><span>1.0 보통 빠르기</span>
              </div>
              <p className="text-[16px] text-slate-500 mt-1">손을 떼면 그 빠르기로 들려줘요. AI 음성은 목소리 높이는 그대로, 빠르기만 바뀌어요.</p>
            </section>

            <section>
              <h3 className="text-[22px] mb-2">✏️ 펜슬 전용 모드 <span className="text-[16px] text-slate-400">(손바닥 무시)</span></h3>
              <${Seg} value=${prefs.pen} onPick=${(v) => set({ pen: v })}
                      options=${[['auto', '자동'], ['on', '항상 켜기'], ['off', '끄기']]} />
              <p className="text-[16px] text-slate-500 mt-2 leading-relaxed">
                자동: 애플 펜슬을 한 번 쓰면 그때부터 손가락·손바닥으로는 그려지지 않아요.
                손가락으로 쓰려면 <b>끄기</b>를 고르세요. (지금: <b>${penOnly ? '켜짐' : '꺼짐'}</b>${prefs.pen === 'auto' && !penSeen ? ', 아직 펜슬을 쓰지 않았어요' : ''})
              </p>
            </section>
          </div>
        </div>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
